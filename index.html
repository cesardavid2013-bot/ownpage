<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lumi — Where sparks find their light</title>
  <meta name="description" content="Lumi is a premium dating app: verified profiles, real-time chat and three memberships, in 20 languages on iPhone, Android and the web." />
  <meta name="theme-color" content="#0a0a0c" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="apple-touch-icon" href="assets/favicon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lumi — Where sparks find their light" />
  <meta property="og:description" content="Premium dating in 20 languages. iPhone, Android and web." />
  <meta property="og:image" content="assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="wordmark" href="#top">LUMI<sup>✦</sup></a>
      <nav class="nav-links">
        <a href="#features" data-i18n="nav.features"></a>
        <a href="#membership" data-i18n="nav.premium"></a>
        <a href="#safety" data-i18n="nav.safety"></a>
        <a href="#faq" data-i18n="nav.faq"></a>
      </nav>
      <div class="nav-right">
        <select class="lang" id="lang" aria-label="Language"></select>
        <a class="btn btn-line" data-app-link data-i18n="nav.open"></a>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <canvas data-bokeh="hero" aria-hidden="true"></canvas>
      <div class="wrap">
        <div>
          <span class="label" data-i18n="hero.eyebrow"></span>
          <h1><span data-i18n="hero.title1"></span> <em data-i18n="hero.title2"></em></h1>
          <p class="lead" data-i18n="hero.lead"></p>
          <div class="hero-cta">
            <a class="btn btn-solid" data-app-link data-i18n="hero.start"></a>
            <a class="btn-text" href="#membership" data-i18n="hero.premium"></a>
          </div>
          <div class="stores" data-stores></div>
        </div>
        <div class="phone-wrap reveal" aria-hidden="true">
          <div class="phone">
            <div class="screen">
              <div class="photo"><img data-fallback="portrait" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=700&q=80" alt="" /></div>
              <div class="shade"></div>
              <div class="bars"><i></i><i></i><i></i><i></i></div>
              <div class="meta">
                <h3>Valentina <span>28</span></h3>
                <p>Architect · Lisbon · 3 km</p>
              </div>
              <div class="acts">
                <span><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></span>
                <span><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span>
                <span class="like"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>
              </div>
            </div>
          </div>
          <div class="note-chip a"><span class="label" data-i18n="chip.super"></span><span class="serif" data-i18n="note.text"></span></div>
          <div class="note-chip b"><span class="serif" data-i18n="chip.match"></span></div>
        </div>
      </div>
    </section>

    <section class="manifesto">
      <div class="wrap">
        <blockquote class="reveal" data-i18n-html="manifesto"></blockquote>
        <div class="facts">
          <span><b>20</b><span data-i18n="stats.langs"></span></span>
          <span><b>iOS · Android · Web</b><span data-i18n="stats.platforms"></span></span>
          <span><b>Live</b><span data-i18n="stats.realtime"></span></span>
          <span><b>18+</b><span data-i18n="stats.adults"></span></span>
        </div>
      </div>
    </section>

    <section class="block" id="features">
      <div class="wrap">
        <div class="head">
          <div><span class="label" data-i18n="features.eyebrow"></span><h2 data-i18n="features.title"></h2></div>
          <p data-i18n="features.subtitle"></p>
        </div>
        <div class="rows">
          <div class="row reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2.5-5 .3 1.8 1 2.8 2 3 0-3-.5-5.5.5-8z"/></svg></span><h3 data-i18n="f1.t"></h3><p data-i18n="f1.d"></p></div>
          <div class="row reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 10h8M8 13h5"/></svg></span><h3 data-i18n="f2.t"></h3><p data-i18n="f2.d"></p></div>
          <div class="row reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span><h3 data-i18n="f3.t"></h3><p data-i18n="f3.d"></p></div>
          <div class="row reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M10.5 13.5 3 11l1.5-1.5 8 1 4-4.5c1-1 2.8-1.3 3.3-.8s.2 2.3-.8 3.3l-4.5 4 1 8L15 22l-2.5-7.5-3 3V20L8 21l-1-3-3-1 1-1.5h2.5z"/></svg></span><h3 data-i18n="f4.t"></h3><p data-i18n="f4.d"></p></div>
          <div class="row reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 10h18M5 10l1.5 5.5a2 2 0 0 0 2 1.5h1a2 2 0 0 0 2-1.6L12 13l.5 2.4a2 2 0 0 0 2 1.6h1a2 2 0 0 0 2-1.5L19 10M7 10l2-5h6l2 5"/></svg></span><h3 data-i18n="f5.t"></h3><p data-i18n="f5.d"></p></div>
          <div class="row reveal"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9S9.5 5.5 12 3z"/></svg></span><h3 data-i18n="f6.t"></h3><p data-i18n="f6.d"></p></div>
        </div>
        <div class="gallery" aria-label="Members">
          <figure class="shot reveal"><img data-fallback="portrait" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=900&q=80" alt="" loading="lazy" /><figcaption><b>Camila, 29</b>Buenos Aires</figcaption></figure>
          <figure class="shot reveal"><img data-fallback="portrait" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=900&q=80" alt="" loading="lazy" /><figcaption><b>Mateo, 31</b>Madrid</figcaption></figure>
          <figure class="shot reveal"><img data-fallback="portrait" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80" alt="" loading="lazy" /><figcaption><b>Léa, 27</b>Paris</figcaption></figure>
        </div>
      </div>
    </section>

    <section class="block">
      <div class="wrap">
        <div class="head"><div><h2 data-i18n="how.title"></h2></div></div>
        <div class="steps">
          <div class="step reveal"><div class="num">I</div><h3 data-i18n="s1.t"></h3><p data-i18n="s1.d"></p></div>
          <div class="step reveal"><div class="num">II</div><h3 data-i18n="s2.t"></h3><p data-i18n="s2.d"></p></div>
          <div class="step reveal"><div class="num">III</div><h3 data-i18n="s3.t"></h3><p data-i18n="s3.d"></p></div>
        </div>
      </div>
    </section>

    <section class="block" id="membership">
      <div class="wrap">
        <div class="head">
          <div><span class="label">Lumi Membership</span><h2 data-i18n="premium.title"></h2></div>
          <p data-i18n="premium.subtitle"></p>
        </div>
        <div class="tiers">
          <div class="tier reveal">
            <div class="card plus" aria-hidden="true">
              <div class="top"><span class="brand">LUMI</span><span class="chip"></span></div>
              <div><div class="no">•••• 2026 0999</div><div class="tiername">Plus</div></div>
            </div>
            <span class="flag"></span>
            <div class="price"><strong>$9.99</strong><small data-i18n="premium.month"></small></div>
            <ul>
              <li data-i18n="pf.unlimited"></li>
              <li data-i18n="pf.rewind"></li>
              <li data-i18n="pf.passport"></li>
              <li data-i18n="pf.hide"></li>
            </ul>
            <a class="btn btn-line" data-app-link data-app-path="/premium" data-i18n="premium.choose"></a>
          </div>
          <div class="tier reveal">
            <div class="card gold" aria-hidden="true">
              <div class="top"><span class="brand">LUMI</span><span class="chip"></span></div>
              <div><div class="no">•••• 2026 1999</div><div class="tiername">Gold</div></div>
            </div>
            <span class="flag" data-i18n="premium.popular"></span>
            <div class="price"><strong>$19.99</strong><small data-i18n="premium.month"></small></div>
            <ul>
              <li data-i18n="pf.allPlus"></li>
              <li data-i18n="pf.seeLikes"></li>
              <li data-i18n="pf.super5"></li>
              <li data-i18n="pf.boost1"></li>
            </ul>
            <a class="btn btn-solid" data-app-link data-app-path="/premium" data-i18n="premium.choose"></a>
          </div>
          <div class="tier reveal">
            <div class="card platinum" aria-hidden="true">
              <div class="top"><span class="brand">LUMI</span><span class="chip"></span></div>
              <div><div class="no">•••• 2026 2999</div><div class="tiername">Platinum</div></div>
            </div>
            <span class="flag" data-i18n="premium.best"></span>
            <div class="price"><strong>$29.99</strong><small data-i18n="premium.month"></small></div>
            <ul>
              <li data-i18n="pf.allGold"></li>
              <li data-i18n="pf.priority"></li>
              <li data-i18n="pf.notes"></li>
              <li data-i18n="pf.incognito"></li>
              <li data-i18n="pf.super10"></li>
            </ul>
            <a class="btn btn-line" data-app-link data-app-path="/premium" data-i18n="premium.choose"></a>
          </div>
        </div>
        <p class="fine" data-i18n="premium.note"></p>
      </div>
    </section>

    <section class="block" id="safety">
      <div class="wrap">
        <div class="head">
          <div><span class="label" data-i18n="safety.eyebrow"></span><h2 data-i18n="safety.title"></h2></div>
          <p data-i18n="safety.subtitle"></p>
        </div>
        <div class="pledges">
          <div class="pledge reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"/><path d="m9 12 2 2 4-4"/></svg></span><div><b data-i18n="sa1.t"></b><span data-i18n="sa1.d"></span></div></div>
          <div class="pledge reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></span><div><b data-i18n="sa2.t"></b><span data-i18n="sa2.d"></span></div></div>
          <div class="pledge reveal"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 9.5h1.5V15M13 12a1.8 1.8 0 1 1 0-3.5 1.8 1.8 0 0 1 0 3.5zm0 0a1.8 1.8 0 1 0 0 3.5 1.8 1.8 0 0 0 0-3.5z"/></svg></span><div><b data-i18n="sa3.t"></b><span data-i18n="sa3.d"></span></div></div>
          <div class="pledge reveal"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></span><div><b data-i18n="sa4.t"></b><span data-i18n="sa4.d"></span></div></div>
        </div>
      </div>
    </section>

    <section class="block" id="faq">
      <div class="wrap">
        <div class="head"><div><h2 data-i18n="faq.title"></h2></div></div>
        <div class="faq">
          <details><summary data-i18n="q1"></summary><p data-i18n="a1"></p></details>
          <details><summary data-i18n="q2"></summary><p data-i18n="a2"></p></details>
          <details><summary data-i18n="q3"></summary><p data-i18n="a3"></p></details>
          <details><summary data-i18n="q4"></summary><p data-i18n="a4"></p></details>
          <details><summary data-i18n="q5"></summary><p data-i18n="a5"></p></details>
        </div>
      </div>
    </section>

    <section class="closing">
      <canvas data-bokeh="closing" aria-hidden="true"></canvas>
      <div class="wrap">
        <h2 data-i18n="cta.title"></h2>
        <p data-i18n="cta.text"></p>
        <a class="btn btn-solid" data-app-link data-i18n="hero.start"></a>
        <div class="stores" data-stores></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div>
        <a class="wordmark" href="#top">LUMI<sup>✦</sup></a>
        <p style="margin-top: 10px">© <span id="year"></span> Lumi. <span data-i18n="footer.rights"></span></p>
      </div>
      <nav>
        <a href="privacy.html" data-i18n="footer.privacy"></a>
        <a href="terms.html" data-i18n="footer.terms"></a>
        <a href="safety.html" data-i18n="footer.safety"></a>
        <a href="delete-account.html" data-i18n="footer.delete"></a>
        <span><span data-i18n="footer.contact"></span>: support@lumi.app</span>
      </nav>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="main.js"></script>
</body>
</html>
