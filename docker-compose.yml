# Lumi en tu ordenador: base de datos + API + app web + panel /admin, con un solo comando.
#   docker compose up --build
# Después abre http://localhost:4000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: lumi
      POSTGRES_DB: lumi
    volumes:
      - lumi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 3s
      timeout: 3s
      retries: 20

  lumi:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "4000:4000"
    environment:
      # "development" = modo local: las compras son simuladas (sin Stripe) y no se exige HTTPS.
      NODE_ENV: development
      DATABASE_URL: postgres://lumi:lumi@db:5432/lumi
      JWT_SECRET: local-only-secret-change-me-0123456789abcdef
      ADMIN_TOKEN: local-admin-token-0123456789abcdef
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
    volumes:
      - lumi-data:/data

  # Perfiles de demostración (usuario demo@lumi.app / password123). Solo se ejecuta cuando tú lo pides.
  seed:
    build: .
    profiles: ["seed"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://lumi:lumi@db:5432/lumi
      JWT_SECRET: local-only-secret-change-me-0123456789abcdef
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
    command: ["node", "dist/db/seed.js"]

volumes:
  lumi-db:
  lumi-data:
