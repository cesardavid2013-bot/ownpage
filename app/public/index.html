<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Lumi</title>
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style id="expo-reset">
      html, body { height: 100%; background: #0A0A0C; color: #E9D9BE; }
      body { overflow: hidden; margin: 0; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
      /* Wordmark shown until the bundle mounts, so the first frame is never a blank page. */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
        font: 500 22px/1 "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif; letter-spacing: .5em; color: #C9A46A;
        animation: boot 1.6s ease-in-out infinite alternate; }
      #root:not(:empty) + #boot { display: none; }
      @keyframes boot { from { opacity: .35 } to { opacity: .9 } }
    </style>
  </head>
  <body>
    <noscript>Lumi needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">LUMI</div>
  </body>
</html>
