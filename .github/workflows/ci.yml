name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: dating_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  app:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:i18n
      - run: npx expo export --platform web
        env: { EXPO_PUBLIC_API_URL: same-origin, EXPO_NO_TELEMETRY: 1 }

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node website/check-i18n.mjs

  docker:
    runs-on: ubuntu-latest
    needs: [server, app]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lumi .
      - name: Boot the image against a real database
        run: |
          docker network create lumi
          docker run -d --name db --network lumi -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=lumi postgres:16
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name lumi --network lumi -p 4000:4000 \
            -e DATABASE_URL=postgres://postgres:postgres@db:5432/lumi \
            -e JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef lumi
          for i in $(seq 1 30); do curl -fs localhost:4000/health && break; sleep 1; done
          curl -fs localhost:4000/health
          curl -fs -H 'Accept: text/html' localhost:4000/ | grep -q 'id="root"'
          curl -fs localhost:4000/billing/plans | grep -q platinum
          curl -fs localhost:4000/admin/ | grep -qi lumi
      - if: failure()
        run: docker logs lumi || true
